<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Portal Worlds: The Deep Sea</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #021018; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      button { border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #veil { position: fixed; inset: 0; pointer-events: none; background: #6fe3ff; opacity: 1; transition: opacity 1.8s ease; z-index: 9; }
      #veil.open { opacity: 0; }
      .round { position: fixed; top: 14px; width: 52px; height: 52px; border-radius: 50%; z-index: 3; }
      #home { left: 14px; background: radial-gradient(circle, #fff 0%, #8fd49a 45%, #4f9a5c 100%); box-shadow: 0 0 16px #8fd49a; }
      #sound { right: 14px; background: rgba(160, 230, 255, 0.16); color: #cff4ff; font-size: 22px; box-shadow: 0 0 12px rgba(120, 220, 255, 0.35); }
      /* How deep she is: light at the top, black at the bottom. */
      #gauge { position: fixed; right: 34px; top: 84px; bottom: 30px; width: 10px; border-radius: 5px; background: linear-gradient(#8fe6f4, #1a5a8a 35%, #06142a 70%, #000); box-shadow: 0 0 0 1px rgba(160, 230, 255, 0.25); z-index: 3; pointer-events: none; }
      #mark { position: absolute; left: -7px; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%; background: #dff8ff; box-shadow: 0 0 14px #7fe6ff; }
      /* A wordless hint: arrows that drift down, until she has moved. */
      #hint { position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%); color: #dff8ff; font: 44px system-ui, sans-serif; opacity: 0.85; pointer-events: none; z-index: 3; animation: sink 1.6s ease-in-out infinite; transition: opacity 0.8s; text-shadow: 0 0 14px #7fe6ff; }
      @keyframes sink { 0% { transform: translate(-50%, -14px); opacity: 0.2; } 50% { opacity: 0.9; } 100% { transform: translate(-50%, 14px); opacity: 0.2; } }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <button id="home" class="round" aria-label="Back to the wood"></button>
    <button id="sound" class="round" aria-label="Sound on or off">♪</button>
    <div id="gauge"><div id="mark"></div></div>
    <div id="hint">⌄</div>
    <div id="veil"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
