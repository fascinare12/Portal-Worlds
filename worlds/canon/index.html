<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Portal Worlds: The Endless Canon</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f2ee; -webkit-user-select: none; user-select: none; font-family: Georgia, 'Times New Roman', serif; color: #2f3440; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
      button { border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; }
      #veil { position: fixed; inset: 0; pointer-events: none; background: #f6f4ee; opacity: 1; transition: opacity 1.6s ease; z-index: 9; }
      #veil.open { opacity: 0; }
      .round { position: fixed; top: 14px; width: 52px; height: 52px; border-radius: 50%; z-index: 3; font-size: 22px; background: rgba(255, 255, 255, 0.8); box-shadow: 0 1px 10px rgba(60, 70, 90, 0.25); }
      #home { left: 14px; background: radial-gradient(circle, #fff 0%, #8fd49a 45%, #4f9a5c 100%); box-shadow: 0 0 16px #8fd49a; }
      #sound { right: 14px; }
      #eye { right: 76px; }
      #fresh { right: 138px; font-size: 14px; }
      #eye.call { animation: call 1.1s ease-in-out infinite; }
      @keyframes call { 50% { box-shadow: 0 0 0 10px rgba(201, 149, 28, 0.35); } }
      /* The twelve keys, as a clock: the ones this climb has passed through are lit. */
      #clock { position: fixed; left: 76px; top: 8px; width: 96px; height: 96px; z-index: 3; pointer-events: none; transform-origin: 0 0; transition: transform 0.6s; }
      #clock.big { transform: scale(1.9); }
      #count { position: fixed; left: 176px; top: 40px; z-index: 3; font-size: 15px; opacity: 0.75; pointer-events: none; }
      #panel { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(720px, calc(100% - 24px)); box-sizing: border-box; background: rgba(255, 255, 255, 0.86); border-radius: 16px; padding: 12px 16px 12px; z-index: 4; box-shadow: 0 2px 18px rgba(60, 70, 90, 0.22); }
      #stage { font-variant: small-caps; letter-spacing: 0.06em; color: #a8741a; font-size: 14px; cursor: pointer; }
      #panel.folded #say, #panel.folded #rules { display: none; }
      @media (max-width: 560px) { #count { left: 14px; top: 104px; font-size: 13px; } #say { font-size: 15px; } .rule span { min-width: 70px; } }
      #say { margin: 2px 0 8px; font-size: 17px; line-height: 1.38; }
      #rules { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
      .rule { display: flex; align-items: center; gap: 6px; font-size: 15px; }
      .rule b { font-weight: normal; opacity: 0.7; }
      .rule span { min-width: 92px; text-align: center; font-weight: bold; }
      .rule button, .chip { width: 36px; height: 36px; border-radius: 50%; background: #2f3440; color: #fff; font-size: 16px; }
      .chip { width: auto; padding: 0 14px; border-radius: 18px; font-size: 15px; }
      .chip.off { background: #c9c6be; }
      .chip.v0 { background: #c9951c; } .chip.v1 { background: #2c7f93; } .chip.v2 { background: #b9486e; }
      .chip.v0.off, .chip.v1.off, .chip.v2.off { background: #c9c6be; }
      #next { display: none; margin-left: auto; background: #c9951c; }
      #next.show { display: inline-block; }
      /* How much the voices are quarrelling just now. */
      #quarrel { height: 6px; border-radius: 3px; background: #e6e3dc; margin-top: 10px; overflow: hidden; }
      #quarrel i { display: block; height: 100%; width: 0%; background: #b23a3a; transition: width 0.12s linear; }
      #begin { position: fixed; inset: 0; z-index: 8; background: rgba(244, 242, 238, 0.72); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 20px; }
      #begin h1 { font-weight: normal; font-size: 34px; margin: 0; }
      #begin p { margin: 0; max-width: 460px; font-size: 17px; line-height: 1.4; opacity: 0.8; }
      #begin button { margin-top: 10px; padding: 12px 28px; border-radius: 26px; background: #2f3440; color: #fff; font-size: 19px; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <button id="home" class="round" aria-label="Back to the wood"></button>
    <button id="fresh" class="round" aria-label="Start again">new</button>
    <button id="eye" class="round" aria-label="Look from the side or from above">◉</button>
    <button id="sound" class="round" aria-label="Sound on or off">♪</button>
    <svg id="clock" viewBox="-50 -50 100 100"></svg>
    <div id="count"></div>
    <div id="panel">
      <div id="stage"></div>
      <div id="say"></div>
      <div id="rules"></div>
      <div id="quarrel"><i></i></div>
    </div>
    <div id="begin">
      <h1>The Endless Canon</h1>
      <p>Eight bars that Johann Sebastian Bach wrote in 1747, which never arrive anywhere and never stop rising. Build them, one rule at a time.</p>
      <button id="go">Begin</button>
    </div>
    <div id="veil"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
