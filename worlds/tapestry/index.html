<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Portal Worlds: The Tapestry</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #d9cdb0; -webkit-user-select: none; user-select: none; font-family: Georgia, 'Times New Roman', serif; color: #3b302b; }
      canvas { display: block; position: fixed; left: 0; top: 0; touch-action: none; cursor: grab; }
      button { border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; font: inherit; color: inherit; }
      #veil { position: fixed; inset: 0; pointer-events: none; background: #d98a1e; opacity: 1; transition: opacity 1.8s ease; z-index: 9; }
      #veil.open { opacity: 0; }
      /* All the buttons live on the desk, so that nothing sits over the cloth. */
      .round { width: 40px; height: 40px; border-radius: 50%; flex: none; }
      #home { background: radial-gradient(circle, #fff 0%, #8fd49a 45%, #4f9a5c 100%); box-shadow: 0 0 10px #8fd49a; }
      #sound { background: #e6dcc2; box-shadow: inset 0 0 0 2px #3b302b; font-size: 18px; }
      #beasts { background: #e6dcc2 center / 78% no-repeat; box-shadow: inset 0 0 0 2px #3b302b; }

      /* The scribe's desk: where the account is read and the questions are answered. */
      #desk { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; flex-direction: column; background: #f1e9d3; box-shadow: 0 -3px 0 #3b302b, 0 -7px 0 #b0502c; }
      #bar { display: flex; align-items: center; gap: 7px; padding: 8px 10px 6px; border-bottom: 1px solid rgba(59, 48, 43, 0.25); }
      #bar .nav { width: 40px; height: 40px; border-radius: 50%; background: #e6dcc2; box-shadow: inset 0 0 0 2px #3b302b; font-size: 18px; flex: none; }
      #bar .nav:disabled { opacity: 0.3; cursor: default; }
      #where { flex: 1; min-width: 0; text-align: center; line-height: 1.2; }
      #where i { display: block; font-style: normal; font-variant: small-caps; letter-spacing: 0.08em; font-size: 12px; color: #b0502c; }
      #where b { display: block; font-size: 19px; letter-spacing: 0.02em; }
      #where span { font-size: 13px; opacity: 0.75; font-style: italic; }
      #page { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px max(14px, calc(50% - 400px)) 18px; font-size: 17px; line-height: 1.5; -webkit-user-select: text; user-select: text; }
      #page p { margin: 0 0 9px; }
      #page .latin { font-variant: small-caps; letter-spacing: 0.06em; color: #2a3a55; margin-bottom: 2px; }
      #page .means { font-style: italic; opacity: 0.8; margin-bottom: 10px; }
      #page .source { font-size: 14px; font-style: italic; opacity: 0.75; border-left: 3px solid #c4963a; padding-left: 9px; margin: 10px 0 12px; }
      #page .ask { font-size: 19px; font-weight: 600; margin: 4px 0 10px; }
      #page .voice { font-variant: small-caps; letter-spacing: 0.08em; color: #b0502c; font-weight: 600; margin-bottom: 4px; }
      .go, .pick { display: block; width: 100%; text-align: left; padding: 11px 14px; margin: 7px 0; border-radius: 6px; background: #e6dcc2; box-shadow: inset 0 0 0 2px #3b302b; font-size: 17px; line-height: 1.35; }
      .go { text-align: center; background: #2a3a55; color: #f1e9d3; box-shadow: none; font-weight: 600; letter-spacing: 0.03em; }
      .go.quiet { background: #e6dcc2; color: #3b302b; box-shadow: inset 0 0 0 2px #3b302b; }
      .pick:disabled { opacity: 0.4; text-decoration: line-through; cursor: default; }
      .pick.done::after { content: ' ✓'; color: #7c8a55; font-weight: 700; }
      /* The creature from the border, leaning in with a hint. */
      .hint { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0 2px; padding: 9px 12px; border-radius: 6px; background: #f7e8c2; box-shadow: inset 0 0 0 2px #c4963a; font-style: italic; }
      .hint i { flex: none; font-style: normal; font-size: 26px; line-height: 1; }
      .dots { display: flex; gap: 6px; margin: 0 0 8px; }
      .dots i { width: 22px; height: 6px; border-radius: 3px; background: rgba(59, 48, 43, 0.2); }
      .dots i.on { background: #b0502c; }
      .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
      .acts button { padding: 4px 11px; border-radius: 14px; font-size: 13px; font-variant: small-caps; letter-spacing: 0.06em; background: #e6dcc2; box-shadow: inset 0 0 0 1.5px rgba(59, 48, 43, 0.5); }
      .acts button.here { background: #b0502c; color: #f1e9d3; box-shadow: none; }
      .hint img { flex: none; width: 46px; height: 40px; }
      .hint b { font-style: normal; font-variant: small-caps; letter-spacing: 0.05em; font-size: 13px; display: block; opacity: 0.7; }
      .hint.bird { background: #e9efe2; box-shadow: inset 0 0 0 2px #7c8a55; }
      /* True, and odd: a reward for finishing a panel, kept apart from what is examined. */
      .odd { margin: 10px 0; padding: 9px 12px; border-radius: 6px; background: #efe2ef; box-shadow: inset 0 0 0 2px #8a4a34; font-size: 16px; }
      .odd b { font-variant: small-caps; letter-spacing: 0.06em; color: #8a4a34; }
      .runes { font-family: Runes, serif; font-size: 30px; letter-spacing: 0.08em; color: #2a3a55; line-height: 1.3; margin: 4px 0; }
      .key { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin: 8px 0 12px; }
      .key span { text-align: center; padding: 3px 0 4px; border-radius: 5px; background: #e6dcc2; font-size: 13px; }
      .key span i { display: block; font: 26px Runes, serif; font-style: normal; color: #2a3a55; }
      .slots { display: flex; gap: 6px; margin: 10px 0; }
      .slots span { width: 44px; text-align: center; padding: 2px 0 6px; border-bottom: 3px solid #3b302b; font-size: 22px; min-height: 62px; }
      .slots span i { display: block; font: 30px Runes, serif; font-style: normal; color: #2a3a55; }
      .slots span.now { border-color: #b0502c; }
      .letters { display: flex; flex-wrap: wrap; gap: 6px; }
      .letters button { width: 42px; height: 42px; border-radius: 6px; background: #e6dcc2; box-shadow: inset 0 0 0 2px #3b302b; font-size: 19px; }
      .letters button.no { animation: no 0.3s; background: #e9b7a4; }
      @keyframes no { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      .zoo { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 9px; margin: 8px 0 14px; }
      .zoo div { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; background: #e6dcc2; font-size: 14px; line-height: 1.3; }
      .zoo div.locked { opacity: 0.45; }
      .zoo img { flex: none; width: 64px; height: 54px; }
      .zoo b { display: block; font-size: 15px; }
      /* What a caption says, and where it is from: shown when the pointer rests on it. */
      #tip { position: fixed; z-index: 5; max-width: 340px; padding: 8px 11px; border-radius: 6px; background: #f1e9d3; box-shadow: 0 0 0 2px #3b302b, 0 6px 16px rgba(40, 26, 12, 0.3); font-size: 14px; line-height: 1.35; pointer-events: none; display: none; }
      #tip b { font-variant: small-caps; letter-spacing: 0.06em; color: #b0502c; display: block; }
      #tip i { display: block; margin-top: 3px; opacity: 0.75; font-size: 13px; }
      .tally { font-size: 14px; opacity: 0.75; margin-top: 8px; }
    </style>
  </head>
  <body>
    <canvas id="cloth"></canvas>
    <div id="desk">
      <div id="bar">
        <button id="home" class="round" aria-label="Back to the wood"></button>
        <button class="nav" id="back" aria-label="The panel before">◀</button>
        <div id="where"></div>
        <button class="nav" id="next" aria-label="The panel after">▶</button>
        <button id="beasts" class="round" aria-label="The beasts you have collected"></button>
        <button id="sound" class="round" aria-label="Sound on or off">♪</button>
      </div>
      <div id="page"></div>
    </div>
    <div id="tip"></div>
    <div id="veil"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
